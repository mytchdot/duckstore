services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: duckstore
      MYSQL_USER: duckstore
      MYSQL_PASSWORD: duckstore
    volumes:
      - duckstore_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

volumes:
  duckstore_mysql:
